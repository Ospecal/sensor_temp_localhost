
services:
  db:
    image: postgres:18.6
    container_name: postgres18
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: sensor
      POSTGRES_DB: appdb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: sensor-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:sensor@db:5432/appdb
      API_TOKEN: replace_with_a_long_random_secret
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres18_data:

